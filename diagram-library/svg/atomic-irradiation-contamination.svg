<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Irradiation compared with contamination by radioactive material" width="920" height="340" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="340" fill="#ffffff"/><defs></defs><text x="230.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Irradiation</text><text x="230.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">exposed to radiation from outside</text><text x="690.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Contamination</text><text x="690.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">radioactive atoms get onto or into the body</text><circle cx="300" cy="190" r="34" fill="#e8c4a4"/><rect x="276" y="224" width="48" height="70" rx="12" fill="#3f7fd6"/><rect x="90" y="170" width="50" height="40" fill="#6b7480"/><path d="M146.0 180.0Q156.4 188.0 168.0 182.0Q179.6 176.0 190.0 184.0Q200.4 192.0 212.0 186.0Q223.6 180.0 234.0 188.0Q244.4 196.0 256.0 190.0" stroke="#b07cff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M268.0 191.1L255.4 197.0L256.6 183.0Z" fill="#b07cff"/><path d="M146.0 192.0Q156.4 200.0 168.0 194.0Q179.6 188.0 190.0 196.0Q200.4 204.0 212.0 198.0Q223.6 192.0 234.0 200.0Q244.4 208.0 256.0 202.0" stroke="#b07cff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M268.0 203.1L255.4 209.0L256.6 195.0Z" fill="#b07cff"/><path d="M146.0 204.0Q156.4 212.0 168.0 206.0Q179.6 200.0 190.0 208.0Q200.4 216.0 212.0 210.0Q223.6 204.0 234.0 212.0Q244.4 220.0 256.0 214.0" stroke="#b07cff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M268.0 215.1L255.4 221.0L256.6 207.0Z" fill="#b07cff"/><text x="230.0" y="320.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">stops when the source is removed; the person is not radioactive</text><circle cx="690" cy="190" r="34" fill="#e8c4a4"/><rect x="666" y="224" width="48" height="70" rx="12" fill="#3f7fd6"/><circle cx="680" cy="250" r="5" fill="#9bff5a"/><circle cx="700" cy="270" r="5" fill="#9bff5a"/><circle cx="690" cy="190" r="5" fill="#9bff5a"/><circle cx="676" cy="180" r="5" fill="#9bff5a"/><text x="690.0" y="320.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">continues until the material is removed or decays</text></svg>