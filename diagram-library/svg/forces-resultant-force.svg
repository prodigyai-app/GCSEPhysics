<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Unbalanced and balanced forces on a crate" width="960" height="360" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="960" height="360" fill="#ffffff"/><defs></defs><path d="M40 240H920" stroke="#1d2733" stroke-width="3"/><rect x="190" y="160" width="100" height="80" rx="6" fill="#c9a06a" stroke="#8a6a3a" stroke-width="3"/><path d="M190 160L290 240M290 160L190 240" stroke="#8a6a3a" stroke-width="2"/><path d="M290.0 200.0L432.0 200.0" stroke="#3fb27f" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M450.0 200.0L432.0 209.0L432.0 191.0Z" fill="#3fb27f"/><text x="370.0" y="185.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">600 N push</text><path d="M190.0 200.0L108.0 200.0" stroke="#ef5b4c" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M90.0 200.0L108.0 191.0L108.0 209.0Z" fill="#ef5b4c"/><text x="140.0" y="185.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">200 N friction</text><text x="240.0" y="290.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Resultant force = 600 − 200 = 400 N to the right</text><text x="240.0" y="312.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">unbalanced: the crate accelerates</text><rect x="670" y="160" width="100" height="80" rx="6" fill="#c9a06a" stroke="#8a6a3a" stroke-width="3"/><path d="M670 160L770 240M770 160L670 240" stroke="#8a6a3a" stroke-width="2"/><path d="M770.0 200.0L862.0 200.0" stroke="#3fb27f" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M880.0 200.0L862.0 209.0L862.0 191.0Z" fill="#3fb27f"/><text x="825.0" y="185.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">300 N</text><path d="M670.0 200.0L578.0 200.0" stroke="#ef5b4c" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M560.0 200.0L578.0 191.0L578.0 209.0Z" fill="#ef5b4c"/><text x="615.0" y="185.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">300 N</text><text x="720.0" y="290.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Resultant force = 0</text><text x="720.0" y="312.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">balanced: stays still or moves at constant velocity</text><text x="480.0" y="50.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733">Arrow length shows the size of each force</text></svg>