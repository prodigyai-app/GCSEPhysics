<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="A 60 kg mass weighs 600 N on Earth and 96 N on the Moon" width="920" height="430" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="430" fill="#ffffff"/><defs></defs><text x="460.0" y="32.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Mass and weight</text><text x="460.0" y="54.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">mass (kg) is the amount of matter; weight (N) is the force of gravity on it</text><defs><radialGradient id="sgmw37e" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#6db3f2"/><stop offset="1" stop-color="#1d4f9a"/></radialGradient><radialGradient id="sgmw37et" cx=".3" cy=".3" r="1"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient><clipPath id="sgmw37ec"><circle cx="230.0" cy="340.0" r="82.0"/></clipPath></defs><circle cx="230.0" cy="340.0" r="82.0" fill="url(#sgmw37e)"/><g clip-path="url(#sgmw37ec)"><path d="M184.9 299.0q24.6 -20.5 45.1 -4.1q12.3 24.6 -8.2 36.9q-8.2 28.7 -24.6 20.5q-20.5 -24.6 -12.3 -53.3Z M242.3 348.2q28.7 -12.3 41.0 12.3q-4.1 32.8 -24.6 36.9q-20.5 -16.4 -16.4 -49.2Z" fill="#4f9a45"/><ellipse cx="230.0" cy="258.0" rx="36.9" ry="13.1" fill="#f4f7f9" opacity=".9"/><path d="M172.6 327.7q32.8 -9.8 65.6 0" stroke="#fff" stroke-width="4.9" fill="none" opacity=".5"/></g><circle cx="230.0" cy="340.0" r="82.0" fill="url(#sgmw37et)"/><g><defs><linearGradient id="sgmw37a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a949c"/><stop offset=".5" stop-color="#8a949c"/><stop offset="1" stop-color="#3d4654"/></linearGradient></defs><rect x="197.0" y="186.0" width="66" height="54" rx="4" fill="url(#sgmw37a)" stroke="#1d2733" stroke-width="1.2"/><rect x="200.0" y="189.0" width="60" height="5" rx="2" fill="#fff" opacity=".3"/><path d="M220.0 186.0q10 -16 20 0" stroke="#7d858f" stroke-width="4" fill="none"/><text x="230.0" y="218.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#fff">60 kg</text></g><path d="M230.0 242.0L230.0 300.0" stroke="#ef5b4c" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M230.0 312.0L224.0 300.0L236.0 300.0Z" fill="#ef5b4c"/><text x="270.0" y="236.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#ef5b4c">weight 600 N</text><text x="230.0" y="110.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Earth: g = 10 N/kg</text><defs><radialGradient id="sgmw37m" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#e4e0d8"/><stop offset="1" stop-color="#8e8a84"/></radialGradient><radialGradient id="sgmw37mt" cx=".3" cy=".3" r="1"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient><clipPath id="sgmw37mc"><circle cx="690.0" cy="340.0" r="82.0"/></clipPath></defs><circle cx="690.0" cy="340.0" r="82.0" fill="url(#sgmw37m)"/><g clip-path="url(#sgmw37mc)"><circle cx="661.3" cy="315.4" r="14.8" fill="#8e8a84" opacity=".7"/><circle cx="658.3" cy="312.4" r="11.1" fill="#c9c4bc" opacity=".6"/><circle cx="710.5" cy="331.8" r="9.8" fill="#8e8a84" opacity=".7"/><circle cx="708.5" cy="329.8" r="7.4" fill="#c9c4bc" opacity=".6"/><circle cx="681.8" cy="368.7" r="11.5" fill="#8e8a84" opacity=".7"/><circle cx="679.5" cy="366.4" r="8.6" fill="#c9c4bc" opacity=".6"/><circle cx="722.8" cy="368.7" r="7.4" fill="#8e8a84" opacity=".7"/><circle cx="721.3" cy="367.2" r="5.5" fill="#c9c4bc" opacity=".6"/><circle cx="649.0" cy="352.3" r="6.6" fill="#8e8a84" opacity=".7"/><circle cx="647.7" cy="351.0" r="4.9" fill="#c9c4bc" opacity=".6"/></g><circle cx="690.0" cy="340.0" r="82.0" fill="url(#sgmw37mt)"/><g><defs><linearGradient id="sgmw37b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a949c"/><