<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="A straight force–extension graph. The area under the line is the energy stored in the spring, one half times force times extension" width="900" height="400" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="900" height="400" fill="#ffffff"/><defs></defs><path d="M120.0 330.0L628.0 330.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M640.0 330.0L628.0 336.0L628.0 324.0Z" fill="#1d2733"/><path d="M120.0 330.0L120.0 52.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M120.0 40.0L126.0 52.0L114.0 52.0Z" fill="#1d2733"/><text x="390.0" y="372.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">extension e (m)</text><text x="40" y="190" font-size="15" font-weight="700" text-anchor="middle" class="sf-lab" fill="#1d2733" transform="rotate(-90 40 190)">force F (N)</text><path d="M120 330L520 330L520 70Z" fill="#2f9e6b" fill-opacity=".25" stroke="none"/><path d="M120.0 330.0L550.0 55.0" stroke="#3a78d8" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M520.0 70.0L520.0 330.0" stroke="#8a94a3" stroke-width="1.5" fill="none" stroke-dasharray="6 5" stroke-linecap="round"/><path d="M120.0 70.0L520.0 70.0" stroke="#8a94a3" stroke-width="1.5" fill="none" stroke-dasharray="6 5" stroke-linecap="round"/><circle cx="520" cy="70" r="6" fill="#3a78d8"/><text x="520.0" y="352.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">e</text><text x="104.0" y="75.0" font-size="16" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700">F</text><text x="390.0" y="280.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">area = ½ F e</text><text x="390.0" y="300.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#2f9e6b">= energy stored</text><text x="215.0" y="150.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3a78d8">gradient = k</text><text x="215.0" y="170.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3a78d8">(F = k e)</text><rect x="650.0" y="80.0" width="230.0" height="120.0" rx="10" fill="#2f9e6b" fill-opacity="0.14" stroke="#2f9e6b" stroke-width="1.6"/><text x="765.0" y="110.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Elastic potential energy</text><text x="765.0" y="140.0" font-size="20" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">E<tspan dy="0.32em" font-size="72%">e</tspan><tspan dy="-0.23em"> = ½ k e²</tspan></text><text x="765.0" y="168.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">k in N/m, e in m</text><text x="765.0" y="188.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733">valid below the limit of proportionality</text></svg>