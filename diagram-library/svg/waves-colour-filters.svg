<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="A prism splitting white light, and how filters and coloured objects work" width="940" height="340" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="340" fill="#ffffff"/><defs></defs><text x="240.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">White light through a prism</text><text x="240.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">splits into a spectrum</text><text x="700.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Coloured filters and objects</text><text x="700.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">absorb some colours, let others through</text><defs><linearGradient id="sgcf19p" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#9fc4d8"/></linearGradient><radialGradient id="sgcf19r" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ff7a6a"/><stop offset="1" stop-color="#a81c1c"/></radialGradient><linearGradient id="sgcf19f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a4a"/><stop offset="1" stop-color="#c81c1c"/></linearGradient></defs><path d="M292 200L440 150" stroke="#ff2a2a" stroke-width="4" opacity=".9"/><path d="M292 200L440 168" stroke="#ff8a2a" stroke-width="4" opacity=".9"/><path d="M292 200L440 186" stroke="#ffe02a" stroke-width="4" opacity=".9"/><path d="M292 200L440 204" stroke="#3ad04a" stroke-width="4" opacity=".9"/><path d="M292 200L440 222" stroke="#2a8aff" stroke-width="4" opacity=".9"/><path d="M292 200L440 240" stroke="#5a3aff" stroke-width="4" opacity=".9"/><path d="M292 200L440 258" stroke="#8a2aff" stroke-width="4" opacity=".9"/><path d="M60 200L232 188" stroke="#fff" stroke-width="5"/><path d="M60 200L232 188" stroke="#ffe" stroke-width="12" opacity=".15"/><path d="M190 260L260 120L330 260Z" fill="url(#sgcf19p)" fill-opacity=".55" stroke="#8fb4cc" stroke-width="2.5"/><path d="M204 252L260 140" stroke="#fff" stroke-width="2" opacity=".6"/><path d="M232 188L292 200" stroke="#fff" stroke-width="3" opacity=".7"/><path d="M520 200H622" stroke="#fff" stroke-width="5"/><rect x="616" y="142" width="32" height="116" rx="3" fill="#3d4654"/><rect x="622" y="150" width="20" height="100" fill="url(#sgcf19f)" opacity=".85"/><rect x="626" y="154" width="4" height="92" fill="#fff" opacity=".35"/><path d="M648 200H760" stroke="#ff2a2a" stroke-width="5"/><text x="632.0" y="280.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">red filter: only red passes</text><ellipse cx="830.0" cy="236.0" rx="26.0" ry="4.0" fill="#000" opacity="0.28"/><circle cx="830" cy="200" r="30" fill="url(#sgcf19r)"/><text x="830.0" y="270.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">red object: reflects red,</text><text x="830.0" y="286.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">absorbs other colours</text><text x="470.0" y="324.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">opaque objects reflect some colours; white reflects all; black absorbs all</text></svg>