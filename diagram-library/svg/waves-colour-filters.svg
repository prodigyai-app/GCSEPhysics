<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="A prism splitting white light, and how filters and coloured objects work" width="940" height="340" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="340" fill="#ffffff"/><defs></defs><text x="240.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">White light through a prism</text><text x="240.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">splits into a spectrum</text><text x="700.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Coloured filters and objects</text><text x="700.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">absorb some colours, let others through</text><path d="M190 260L260 120L330 260Z" fill="#e8f3f8" fill-opacity=".2" stroke="#a9c4d4" stroke-width="2.5"/><path d="M60 200L230 186" stroke="#fff" stroke-width="4"/><path d="M290 196L440 150" stroke="#ff2a2a" stroke-width="3"/><path d="M290 196L440 168" stroke="#ff8a2a" stroke-width="3"/><path d="M290 196L440 186" stroke="#ffe02a" stroke-width="3"/><path d="M290 196L440 204" stroke="#3ad04a" stroke-width="3"/><path d="M290 196L440 222" stroke="#2a8aff" stroke-width="3"/><path d="M290 196L440 240" stroke="#5a3aff" stroke-width="3"/><path d="M290 196L440 258" stroke="#8a2aff" stroke-width="3"/><path d="M520 200H620" stroke="#fff" stroke-width="5"/><rect x="620" y="150" width="20" height="100" fill="#ef3030" opacity=".8"/><path d="M640 200H760" stroke="#ff2a2a" stroke-width="5"/><text x="630.0" y="280.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">red filter: only red passes</text><circle cx="830" cy="200" r="30" fill="#ef3030"/><text x="830.0" y="270.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">red object: reflects red,</text><text x="830.0" y="286.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">absorbs other colours</text><text x="470.0" y="324.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">opaque objects reflect some colours; white reflects all; black absorbs all</text></svg>