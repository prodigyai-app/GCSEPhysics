<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Power ratings of appliances and calculating the cost of electricity in kilowatt-hours" width="960" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="960" height="380" fill="#ffffff"/><defs></defs><text x="480.0" y="36.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Power, energy and the cost of electricity</text><rect x="70" y="90" width="80" height="80" rx="12" fill="#cfd5dc" opacity=".85"/><text x="110.0" y="196.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">kettle</text><text x="110.0" y="214.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">3 000 W</text><rect x="200" y="90" width="80" height="80" rx="12" fill="#ef8a3a" opacity=".85"/><text x="240.0" y="196.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">hairdryer</text><text x="240.0" y="214.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">1 500 W</text><rect x="330" y="90" width="80" height="80" rx="12" fill="#3d4654" opacity=".85"/><text x="370.0" y="196.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">TV</text><text x="370.0" y="214.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">100 W</text><rect x="460" y="90" width="80" height="80" rx="12" fill="#f5d84a" opacity=".85"/><text x="500.0" y="196.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">LED bulb</text><text x="500.0" y="214.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">10 W</text><text x="260.0" y="260.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">power (W) = energy transferred every second</text><text x="260.0" y="282.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">1 kW = 1 000 W</text><rect x="620" y="80" width="280" height="180" rx="10" fill="#3d4654"/><rect x="640" y="100" width="240" height="40" rx="4" fill="#9fe0b0"/><text x="760.0" y="128.0" font-size="18" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#163a22">01 234.5 kWh</text><text x="760.0" y="170.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#e8ecf5">electricity meter</text><text x="760.0" y="210.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#e8ecf5">energy (kWh) = power (kW) × time (h)</text><text x="760.0" y="230.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#e8ecf5">cost = kWh × price per kWh</text><text x="480.0" y="330.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Example: a 3 kW kettle used for 0.1 h = 0.3 kWh; at 25p per kWh it costs 7.5p</text></svg>