<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-label="The electromagnetic spectrum from radio waves to gamma rays, with one use and one hazard for each type" width="980" height="430" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="980" height="430" fill="#ffffff"/><defs></defs><path d="M30.0 52.0L939.0 52.0" stroke="#1d2733" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M950.0 52.0L939.0 57.5L939.0 46.5Z" fill="#1d2733"/><text x="40.0" y="36.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">low frequency, long wavelength</text><text x="940.0" y="36.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">high frequency, short wavelength</text><rect x="40.0" y="76.0" width="118.0" height="70.0" rx="10" fill="#c2442f" fill-opacity="0.22" stroke="#c2442f" stroke-width="1.6"/><text x="99.0" y="118.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Radio</text><text x="99.0" y="176.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">USE</text><text x="99.0" y="198.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">TV and radio broadcasts</text><text x="99.0" y="292.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#c2442f">HAZARD</text><text x="99.0" y="314.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">none at normal levels</text><rect x="170.0" y="76.0" width="118.0" height="70.0" rx="10" fill="#e8792a" fill-opacity="0.22" stroke="#e8792a" stroke-width="1.6"/><text x="229.0" y="118.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Microwave</text><text x="229.0" y="176.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">USE</text><text x="229.0" y="198.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">cooking</text><text x="229.0" y="216.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">satellite links</text><text x="229.0" y="292.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#c2442f">HAZARD</text><text x="229.0" y="314.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">heats</text><text x="229.0" y="332.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">body cells</text><rect x="300.0" y="76.0" width="118.0" height="70.0" rx="10" fill="#d9a521" fill-opacity="0.22" stroke="#d9a521" stroke-width="1.6"/><text x="359.0" y="118.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Infrared</text><text x="359.0" y="176.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">USE</text><text x="359.0" y="198.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">heaters</text><text x="359.0" y="216.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">remote controls</text><text x="359.0" y="234.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">cameras</text><text x="359.0" y="292.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#c2442f">HAZARD</text><text x="359.0" y="314.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">skin burns</text><rect x="430.0" y="76.0" width="118.0" height="70.0" rx="10" fill="#3fae6c" fill-opacity="0.22" stroke="#3fae6c" stroke-width="1.6"/><text x="489.0" y="118.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Visible</text><text x="489.0" y="176.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">USE</text><text x="489.0" y="198.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">sight</text><text x="489.0" y="216.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">fibre optics</text><text x="489.0" y="292.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#c2442f">HAZARD</text><text x="489.0" y="314.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">too bright</text><text x="489.0" y="332.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">eye damage</text><rect x="560.0" y="76.0" width="118.0" height="70.0" rx="10" fill="#3a78d8" fill-opacity="0.22" stroke="#3a78d8" stroke-width="1.6"/><text x="619.0" y="118.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Ultraviolet</text><text x="619.0" y="176.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">USE</text><text x="619.0" y="198.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">sun beds</text><text x="619.0" y="216.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">security marking</text><text x="619.0" y="292.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#c2442f">HAZARD</text><text x="619.0" y="314.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">skin cancer</text><text x="619.0" y="332.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">eye damage</text><rect x="690.0" y="76.0" width="118.0" height="70.0" rx="10" fill="#6a5bd0" fill-opacity="0.22" stroke="#6a5bd0" stroke-width="1.6"/><text x="749.0" y="118.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">X-rays</text><text x="749.0" y="176.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">USE</text><text x="749.0" y="198.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">imaging bones</text><text x="749.0" y="292.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#c2442f">HAZARD</text><text x="749.0" y="314.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">ionising</text><text x="749.0" y="332.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">cell damage</text><rect x="820.0" y="76.0" width="118.0" height="70.0" rx="10" fill="#a24bc2" fill-opacity="0.22" stroke="#a24bc2" stroke-width="1.6"/><text x="879.0" y="118.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Gamma</text><text x="879.0" y="176.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">USE</text><text x="879.0" y="198.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">sterilising</text><text x="879.0" y="216.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">radiotherapy</text><text x="879.0" y="292.0" font-size="11" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#c2442f">HAZARD</text><text x="879.0" y="314.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">ionising</text><text x="879.0" y="332.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">cancer</text><text x="490.0" y="390.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Higher-frequency waves carry more energy, so X-rays and gamma rays (ionising) are the most hazardous.</text></svg>