<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="A crate pushed 6.0 metres by a 40 newton force: work done is force times distance, 240 joules" width="900" height="330" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="900" height="330" fill="#ffffff"/><defs></defs><rect x="40" y="226" width="820" height="14" rx="4" fill="#8a94a3" fill-opacity=".35"/><rect x="90" y="170" width="86" height="56" rx="6" fill="#e8792a" fill-opacity=".25" stroke="#e8792a" stroke-width="2"/><text x="133.0" y="205.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">crate</text><rect x="640" y="170" width="86" height="56" rx="6" fill="none" stroke="#e8792a" stroke-width="2" stroke-dasharray="6 5"/><text x="683.0" y="205.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#8a94a3">later</text><path d="M46.0 198.0L73.0 198.0" stroke="#c2442f" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M88.0 198.0L73.0 205.5L73.0 190.5Z" fill="#c2442f"/><text x="46.0" y="154.0" font-size="15" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#c2442f">force F = 40 N</text><path d="M133.0 250.0L133.0 276.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M683.0 250.0L683.0 276.0" stroke="#1d2733" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M133.0 266.0L672.0 266.0" stroke="#3a78d8" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M683.0 266.0L672.0 271.5L672.0 260.5Z" fill="#3a78d8"/><path d="M683.0 266.0L144.0 266.0" stroke="#3a78d8" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M133.0 266.0L144.0 260.5L144.0 271.5Z" fill="#3a78d8"/><text x="408.0" y="292.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3a78d8">distance moved in the direction of the force, s = 6.0 m</text><rect x="560.0" y="40.0" width="300.0" height="84.0" rx="10" fill="#2f9e6b" fill-opacity="0.14" stroke="#2f9e6b" stroke-width="1.6"/><text x="710.0" y="70.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">work done = force × distance</text><text x="710.0" y="96.0" font-size="17" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">W = F s = 40 × 6.0 = 240 J</text><text x="710.0" y="116.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">1 joule = 1 N moving an object 1 m</text><text x="40.0" y="50.0" font-size="17" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">Work done: energy transferred by a force</text><text x="40.0" y="74.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">The same amount of energy is transferred to the crate’s kinetic store</text><text x="40.0" y="90.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">and to the thermal store of the floor and crate (friction).</text></svg>