148q-6 -14 4 -26" stroke="#c9d8e2" stroke-width="2" fill="none" opacity=".7"/><text x="380.0" y="270.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e8ecf5">matt black</text><rect x="640" y="230" width="90" height="56" rx="6" fill="#3d4654"/><path d="M640 248L610 240V276L640 268Z" fill="#55606c"/><rect x="652" y="240" width="66" height="22" rx="3" fill="#9fe0b0"/><text x="685.0" y="256.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#163a22">41.6 °C</text><path d="M685 286V360" stroke="#7d858f" stroke-width="6"/><path d="M468.0 230.0Q478.0 238.0 489.3 232.0Q500.7 226.0 510.7 234.0Q520.7 242.0 532.0 236.0Q543.3 230.0 553.3 238.0Q563.3 246.0 574.7 240.0Q586.0 234.0 596.0 242.0" stroke="#ef5b4c" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M607.9 243.1L595.3 249.0L596.7 235.0Z" fill="#ef5b4c"/><path d="M468.0 254.0Q478.8 260.7 489.3 253.5Q499.8 246.3 510.7 253.0Q521.5 259.7 532.0 252.5Q542.5 245.3 553.3 252.0Q564.2 258.7 574.7 251.5Q585.2 244.3 596.0 251.0" stroke="#ef5b4c" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M608.0 250.7L596.2 258.0L595.8 244.0Z" fill="#ef5b4c"/><path d="M468.0 278.0Q479.6 283.4 489.3 275.0Q499.0 266.6 510.7 272.0Q522.3 277.4 532.0 269.0Q541.7 260.6 553.3 266.0Q565.0 271.4 574.7 263.0Q584.4 254.6 596.0 260.0" stroke="#ef5b4c" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M607.9 258.3L597.0 266.9L595.0 253.1Z" fill="#ef5b4c"/><path d="M535.0 380.0L600.0 380.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M610.0 380.0L600.0 385.0L600.0 375.0Z" fill="#1d2733"/><path d="M535.0 380.0L470.0 380.0" stroke="#1d2733" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M460.0 380.0L470.0 375.0L470.0 385.0Z" fill="#1d2733"/><text x="535.0" y="400.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">same distance for every face</text><text x