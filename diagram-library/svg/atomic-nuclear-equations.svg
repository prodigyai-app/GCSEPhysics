<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="Balanced nuclear equations for alpha and beta decay" width="940" height="340" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="340" fill="#ffffff"/><defs></defs><text x="470.0" y="32.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Nuclear equations</text><text x="470.0" y="54.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">mass numbers and atomic numbers must balance on both sides</text><text x="470.0" y="120.0" font-size="20" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">²³⁸₉₂U  →  ²³⁴₉₀Th  +  ⁴₂He</text><text x="470.0" y="146.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#ef5b4c">alpha decay: mass number −4, atomic number −2</text><text x="470.0" y="210.0" font-size="20" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">¹⁴₆C  →  ¹⁴₇N  +  ⁰₋₁e</text><text x="470.0" y="236.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#3f7fd6">beta decay: a neutron becomes a proton; mass number same, atomic number +1</text><text x="470.0" y="296.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" style="fill:#b07cff">gamma: no change to mass or atomic number (energy given out)</text></svg>