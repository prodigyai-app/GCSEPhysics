<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-label="A roller coaster transferring gravitational potential energy to kinetic energy" width="940" height="360" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="360" fill="#ffffff"/><defs></defs><text x="470.0" y="32.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Kinetic and gravitational potential energy</text><defs><linearGradient id="sgke25c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a6a"/><stop offset="1" stop-color="#b83a2c"/></linearGradient><linearGradient id="sgke25g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc46a"/><stop offset="1" stop-color="#3f7a33"/></linearGradient></defs><path d="M30 340H700" stroke="url(#sgke25g)" stroke-width="10"/><path d="M80 106V336" stroke="#9aa3ad" stroke-width="4"/><path d="M66 336L80 130L94 336" stroke="#9aa3ad" stroke-width="1.6" fill="none"/><path d="M150 118V336" stroke="#9aa3ad" stroke-width="4"/><path d="M136 336L150 142L164 336" stroke="#9aa3ad" stroke-width="1.6" fill="none"/><path d="M210 166V336" stroke="#9aa3ad" stroke-width="4"/><path d="M196 336L210 190L224 336" stroke="#9aa3ad" stroke-width="1.6" fill="none"/><path d="M255 228V336" stroke="#9aa3ad" stroke-width="4"/><path d="M241 336L255 252L269 336" stroke="#9aa3ad" stroke-width="1.6" fill="none"/><path d="M440 278V336" stroke="#9aa3ad" stroke-width="4"/><path d="M426 336L440 302L454 336" stroke="#9aa3ad" stroke-width="1.6" fill="none"/><path d="M490 202V336" stroke="#9aa3ad" stroke-width="4"/><path d="M476 336L490 226L504 336" stroke="#9aa3ad" stroke-width="1.6" fill="none"/><path d="M540 182V336" stroke="#9aa3ad" stroke-width="4"/><path d="M526 336L540 206L554 336" stroke="#9aa3ad" stroke-width="1.6" fill="none"/><path d="M600 220V336" stroke="#9aa3ad" stroke-width="4"/><path d="M586 336L600 244L614 336" stroke="#9aa3ad" stroke-width="1.6" fill="none"/><path d="M60 100Q200 100 300 300Q360 360 420 300Q520 150 640 260" stroke="#55606c" stroke-width="10" fill="none"/><path d="M60 100Q200 100 300 300Q360 360 420 300Q520 150 640 260" stroke="#c9ced4" stroke-width="3" fill="none" stroke-dasharray="2 8"/><g transform="translate(100 96) rotate(0)"><path d="M-24 -6V-26H24V-6Z" fill="url(#sgke25c)" stroke="#6e1c12"/><path d="M-20 -24H20" stroke="#fff" stroke-width="2" opacity=".35"/><circle cx="-14" cy="-3" r="5" fill="#22262e"/><circle cx="14" cy="-3" r="5" fill="#22262e"/><circle cx="-6" cy="-32" r="6" fill="#e8bf98"/><circle cx="8" cy="-32" r="6" fill="#e8bf98"/></g><text x="100.0" y="52.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">top: most GPE, least KE</text><g transform="translate(360 330) rotate(0)"><path d="M-24 -6V-26H24V-6Z" fill="url(#sgke25c)" stroke="#6e1c12"/><path d="M-20 -24H20" stroke="#fff" stroke-width="2" opacity=".35"/><circle cx="-14" cy="-3" r="5" fill="#22262e"/><circle cx="14" cy="-3" r="5" fill="#22262e"/><circle cx="-6" cy="-32" r="6" fill="#e8bf98"/><circle cx="8" cy="-32" r="6" fill="#e8bf98"/></g><text x="360.0" y="356.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">bottom: most KE</text><text x="800.0" y="120.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">E_k = ½ m v²</text><text x="800.0" y="160.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">E_p = m g h</text><text x="800.0" y="210.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">as it falls:</text><text x="800.0" y="228.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">GPE lost = KE gained</text><text x="800.0" y="246.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">(if no energy is wasted)</text></svg>