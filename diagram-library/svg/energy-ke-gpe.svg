<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-label="A roller coaster transferring gravitational potential energy to kinetic energy" width="940" height="360" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="940" height="360" fill="#ffffff"/><defs></defs><text x="470.0" y="32.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Kinetic and gravitational potential energy</text><path d="M60 100Q200 100 300 300Q360 360 420 300Q520 150 640 260" stroke="#7d858f" stroke-width="6" fill="none"/><rect x="80" y="76" width="40" height="22" rx="5" fill="#ef5b4c"/><text x="100.0" y="66.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">top: most GPE, least KE</text><rect x="340" y="316" width="40" height="22" rx="5" fill="#ef5b4c"/><text x="360.0" y="360.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">bottom: most KE</text><text x="800.0" y="120.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">E_k = ½ m v²</text><text x="800.0" y="160.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">E_p = m g h</text><text x="800.0" y="210.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">as it falls:</text><text x="800.0" y="228.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">GPE lost = KE gained</text><text x="800.0" y="246.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">(if no energy is wasted)</text></svg>