<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Distance–time graph showing constant speed, stationary and acceleration" width="900" height="420" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="900" height="420" fill="#ffffff"/><defs></defs><path d="M140 60V350H840" stroke="#1d2733" stroke-width="2.5" fill="none"/><path d="M140.0 70.0L140.0 64.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M140.0 54.0L145.0 64.0L135.0 64.0Z" fill="#1d2733"/><path d="M830.0 350.0L836.0 350.0" stroke="#1d2733" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M846.0 350.0L836.0 355.0L836.0 345.0Z" fill="#1d2733"/><text x="490.0" y="384.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">Time (s)</text><text x="154.0" y="64.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733">Distance (m)</text><path d="M140 350L340 210H500L600 170Q700 140 820 60" stroke="#3f7fd6" stroke-width="4" fill="none"/><text x="298.0" y="266.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">A: steep straight line:</text><text x="298.0" y="282.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">constant, fast speed</text><text x="420.0" y="196.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">B: flat: stationary</text><text x="610.0" y="200.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733">C: gentler slope:</text><text x="610.0" y="216.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">constant, slower speed</text><text x="720.0" y="88.0" font-size="13" text-anchor="end" class="sf-lab" fill="#1d2733">D: curve getting steeper:</text><text x="720.0" y="104.0" font-size="12" text-anchor="end" class="sf-lab" fill="#1d2733">accelerating</text><path d="M180 322H280V252" stroke="#e0a64a" stroke-width="2" stroke-dasharray="5 4" fill="none"/><text x="298.0" y="306.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" style="fill:#e0a64a">speed = gradient = Δd ÷ Δt</text></svg>