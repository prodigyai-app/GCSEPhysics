<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Scalar quantities compared with vector quantities drawn as arrows" width="920" height="340" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="920" height="340" fill="#ffffff"/><defs></defs><text x="230.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Scalars</text><text x="230.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">size only</text><text x="690.0" y="40.0" font-size="16" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Vectors</text><text x="690.0" y="60.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">size and direction: drawn as arrows</text><text x="230.0" y="110.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">distance  20 m</text><text x="230.0" y="140.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">speed  5 m/s</text><text x="230.0" y="170.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">mass  60 kg</text><text x="230.0" y="200.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">energy  300 J</text><text x="230.0" y="230.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">time  4 s</text><path d="M560.0 120.0L688.0 120.0" stroke="#3f7fd6" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M700.0 120.0L688.0 126.0L688.0 114.0Z" fill="#3f7fd6"/><text x="630.0" y="110.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">displacement 20 m east</text><path d="M560.0 180.0L748.0 180.0" stroke="#3fb27f" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M760.0 180.0L748.0 186.0L748.0 174.0Z" fill="#3fb27f"/><text x="660.0" y="170.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">velocity 5 m/s right</text><path d="M560.0 240.0L608.0 240.0" stroke="#ef5b4c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M620.0 240.0L608.0 246.0L608.0 234.0Z" fill="#ef5b4c"/><text x="600.0" y="230.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">force 10 N</text><path d="M760.0 210.0L760.0 288.0" stroke="#e0a64a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M760.0 300.0L754.0 288.0L766.0 288.0Z" fill="#e0a64a"/><text x="774.0" y="260.0" font-size="12" text-anchor="start" class="sf-lab" fill="#1d2733">weight</text><text x="690.0" y="324.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">longer arrow = bigger value</text></svg>