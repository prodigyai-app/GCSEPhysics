<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="A lamp circuit with a 12 volt cell, an ammeter reading 2.0 amps and a voltmeter across the lamp reading 12 volts: power is 24 watts" width="900" height="380" font-family="Arial, Helvetica, sans-serif" color="#1d2733"><rect x="0" y="0" width="900" height="380" fill="#ffffff"/><defs></defs><path d="M90 186V130H248" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M292 130H500V196" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M500 244V280H90V228" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M68.0 192.0L112.0 192.0" stroke="#1d2733" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M79.0 206.0L101.0 206.0" stroke="#1d2733" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M68.0 222.0L112.0 222.0" stroke="#1d2733" stroke-width="3" fill="none" stroke-linecap="round"/><text x="126.0" y="214.0" font-size="14" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700">12 V cell</text><circle cx="270" cy="130" r="22" fill="#e0a64a" fill-opacity=".3" stroke="#1d2733" stroke-width="2.5"/><path d="M256.0 116.0L284.0 144.0" stroke="#1d2733" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M284.0 116.0L256.0 144.0" stroke="#1d2733" stroke-width="2" fill="none" stroke-linecap="round"/><text x="270.0" y="174.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">lamp</text><path d="M230 130V62H248M292 62H310V130" fill="none" stroke="#2f9e6b" stroke-width="2.5"/><circle cx="270" cy="62" r="22" fill="none" stroke="#2f9e6b" stroke-width="3"/><text x="270.0" y="69.0" font-size="20" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">V</text><text x="318.0" y="28.0" font-size="13" text-anchor="start" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#2f9e6b">voltmeter reads 12 V (in parallel with the lamp)</text><circle cx="500" cy="220" r="24" fill="none" stroke="#3a78d8" stroke-width="3"/><text x="500.0" y="227.0" font-size="20" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3a78d8">A</text><text x="466.0" y="226.0" font-size="15" text-anchor="end" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#3a78d8">2.0 A</text><text x="300.0" y="330.0" font-size="13" text-anchor="middle" class="sf-lab" fill="#1d2733">The ammeter is in series; the voltmeter is across the lamp.</text><rect x="560.0" y="60.0" width="320.0" height="240.0" rx="10" fill="#e8792a" fill-opacity="0.12" stroke="#e8792a" stroke-width="1.6"/><text x="720.0" y="92.0" font-size="17" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700">Electrical power</text><text x="720.0" y="128.0" font-size="20" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e8792a">P = V I</text><text x="720.0" y="152.0" font-size="15" text-anchor="middle" class="sf-lab" fill="#1d2733">= 12 × 2.0 = 24 W</text><text x="720.0" y="190.0" font-size="20" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e8792a">P = I² R</text><text x="720.0" y="214.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">(use when V is not known)</text><text x="720.0" y="250.0" font-size="20" text-anchor="middle" class="sf-lab" fill="#1d2733" font-weight="700" style="fill:#e8792a">E = P t</text><text x="720.0" y="274.0" font-size="12" text-anchor="middle" class="sf-lab" fill="#1d2733">energy (J) = power (W) × time (s)</text><text x="300.0" y="358.0" font-size="14" text-anchor="middle" class="sf-lab" fill="#1d2733">24 W means 24 J of energy is transferred by the lamp every second.</text></svg>